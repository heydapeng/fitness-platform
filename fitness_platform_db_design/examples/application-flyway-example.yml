spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fitness_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: fitness_app
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true
